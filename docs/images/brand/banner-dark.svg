  <path d="M775 196 L848 134 L904 156 L945 118 L998 124 L1062 66" stroke="url(#cqi-d-em)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="848" cy="134" r="5.5" fill="#111827" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="904" cy="156" r="5" fill="#111827" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="945" cy="118" r="6" fill="#111827" stroke="#34D399" stroke-width="2.8"/>
  <circle cx="1062" cy="66" r="7" fill="#34D399" stroke="#111827" stroke-width="2.5"/>
